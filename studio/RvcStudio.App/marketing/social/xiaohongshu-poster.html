<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=1242, initial-scale=1" />
  <title>RVC Studio · 小红书首图</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 1242px; height: 1660px; overflow: hidden; }
    body { font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif; background: #071008; }
    .poster {
      position: relative;
      width: 1242px;
      height: 1660px;
      overflow: hidden;
      color: #f5f8f5;
      background: #071008 url("xiaohongshu-bg.png") center / cover no-repeat;
    }
    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 15% 12%, rgba(184, 243, 106, .13), transparent 30%),
        linear-gradient(180deg, rgba(3, 7, 4, .2) 0%, rgba(3, 7, 4, .04) 42%, rgba(3, 7, 4, .52) 100%);
    }
    .topline {
      position: absolute;
      top: 64px;
      left: 74px;
      right: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand { display: flex; align-items: center; gap: 18px; }
    .brand img {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      filter: drop-shadow(0 10px 22px rgba(0, 0, 0, .45));
    }
    .brand-name { font-size: 34px; line-height: 1; font-weight: 800; letter-spacing: -.5px; }
    .brand-kicker { margin-top: 10px; color: #9aa59d; font-size: 17px; font-weight: 700; letter-spacing: 4px; }
    .platform {
      padding: 13px 22px;
      border: 1px solid rgba(184, 243, 106, .5);
      border-radius: 999px;
      background: rgba(17, 27, 19, .72);
      color: #cffa91;
      font-size: 19px;
      font-weight: 800;
      letter-spacing: 1px;
      box-shadow: inset 0 0 28px rgba(184, 243, 106, .06);
    }
    .headline { position: absolute; top: 194px; left: 74px; }
    .headline .eyebrow {
      margin-bottom: 14px;
      color: #b8f36a;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 8px;
    }
    h1 { margin: 0; font-size: 112px; line-height: .98; font-weight: 950; letter-spacing: -8px; }
    h1 span { color: #b8f36a; text-shadow: 0 0 38px rgba(184, 243, 106, .2); }
    .subhead {
      margin-top: 28px;
      color: #d6dfd8;
      font-size: 31px;
      font-weight: 650;
      letter-spacing: 4px;
    }
    .screen-card {
      position: absolute;
      top: 532px;
      left: 72px;
      width: 1098px;
      padding: 13px;
      border: 1px solid rgba(205, 255, 149, .33);
      border-radius: 30px;
      background: linear-gradient(145deg, rgba(43, 59, 46, .9), rgba(8, 13, 9, .96));
      box-shadow: 0 42px 90px rgba(0, 0, 0, .62), 0 0 70px rgba(137, 218, 55, .12);
      transform: perspective(1500px) rotateX(1.5deg) rotateZ(-.7deg);
    }
    .screen {
      position: relative;
      overflow: hidden;
      width: 100%;
      aspect-ratio: 2184 / 1450;
      border: 1px solid #28302b;
      border-radius: 20px;
      background: #0e110f;
    }
    .screen > img { display: block; width: 100%; height: 100%; }
    .scrub {
      position: absolute;
      display: flex;
      align-items: center;
      overflow: hidden;
      padding: 0 12px;
      border: 1px solid #303a34;
      border-radius: 9px;
      background: #111713;
      color: #87938b;
      font-size: 11px;
      font-weight: 650;
      white-space: nowrap;
    }
    .path-a { left: 28.9%; top: 18.25%; width: 28.2%; height: 4.8%; }
    .path-b { left: 63.6%; top: 18.25%; width: 28.1%; height: 4.8%; }
    .account { left: 72.4%; top: 5.1%; width: 11.8%; height: 5.5%; justify-content: center; color: #b8f36a; }
    .gpu { left: 2.4%; top: 42%; width: 13.2%; height: 4.2%; justify-content: center; color: #c8d2ca; }
    .shine {
      position: absolute;
      left: 9%;
      right: 9%;
      bottom: -40px;
      height: 68px;
      border-radius: 50%;
      background: rgba(184, 243, 106, .22);
      filter: blur(32px);
    }
    .feature-row {
      position: absolute;
      left: 72px;
      right: 72px;
      bottom: 150px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }
    .feature {
      min-height: 114px;
      display: flex;
      align-items: center;
      gap: 17px;
      padding: 24px 25px;
      border: 1px solid rgba(184, 243, 106, .44);
      border-radius: 26px;
      background: linear-gradient(145deg, rgba(25, 36, 27, .93), rgba(8, 13, 9, .86));
      box-shadow: 0 20px 34px rgba(0, 0, 0, .27);
      font-size: 23px;
      font-weight: 850;
      white-space: nowrap;
    }
    .feature b {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border-radius: 14px;
      background: #b8f36a;
      color: #14200f;
      font-size: 19px;
      box-shadow: 0 0 24px rgba(184, 243, 106, .2);
    }
    .footer {
      position: absolute;
      left: 76px;
      right: 76px;
      bottom: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: #9aa69e;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: 1px;
    }
    .local { color: #dff7c2; }
  </style>
</head>
<body>
  <main class="poster">
    <header class="topline">
      <div class="brand">
        <img src="../../Assets/rvc-studio-icon.png" alt="" />
        <div>
          <div class="brand-name">RVC Studio</div>
          <div class="brand-kicker">VOICE WORKBENCH</div>
        </div>
      </div>
      <div class="platform">WINDOWS 桌面版</div>
    </header>

    <section class="headline">
      <div class="eyebrow">实时变声工作台</div>
      <h1>开麦就<span>变声</span></h1>
      <div class="subhead">本地实时 · CUDA 加速</div>
    </section>

    <section class="screen-card">
      <div class="screen">
        <img src="../rvc-studio-ui.png" alt="RVC Studio 产品界面" />
        <div class="scrub path-a">models\voice.pth</div>
        <div class="scrub path-b">indices\voice.index</div>
        <div class="scrub account">RVC 账号</div>
        <div class="scrub gpu">NVIDIA GPU</div>
      </div>
      <div class="shine"></div>
    </section>

    <section class="feature-row">
      <div class="feature"><b>F</b><span>FCPE 音高</span></div>
      <div class="feature"><b>↕</b><span>双向降噪</span></div>
      <div class="feature"><b>Q</b><span>QQ · 游戏可用</span></div>
    </section>

    <footer class="footer">
      <span class="local">音频始终在本机处理</span>
      <span>选择音色 · 连接设备 · 开始变声</span>
    </footer>
  </main>
</body>
</html>
